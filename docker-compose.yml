version: "3.9"

services:
  # ── Isolyth server ──────────────────────────────────────────────
  isolyth:
    build:
      context: .
      dockerfile: Dockerfile
    image: isolyth:latest
    container_name: isolyth
    restart: unless-stopped
    stdin_open: true   # keep stdin open for MCP stdio transport
    tty: false
    environment:
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - DB_URL=postgresql://sentinel:sentinel@postgres:5432/sentineldb
    volumes:
      - sentinel_workspace:/workspace
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── Redis (rate-limit + session cache) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # ── PostgreSQL (db_query tool backend) ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentineldb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentineldb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Prometheus (metrics scraping) ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - observability

volumes:
  sentinel_workspace:
  redis_data:
  postgres_data:
