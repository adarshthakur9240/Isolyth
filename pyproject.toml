[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "WARNING"
markers = [
    "integration: marks tests that require external services (database, network). Deselect with -m 'not integration'.",
]

# ── Ruff linter configuration ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
# Directories to lint
src = ["server"]
# Directories to ignore entirely
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Rule sets: E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade,
# B = bugbear, C4 = flake8-comprehensions, SIM = flake8-simplify
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long – handled by formatter
    "B008",   # function call in default argument (common in FastAPI)
    "UP007",  # use X | Y instead of Optional[X] – requires Python 3.10+
]

[tool.ruff.lint.isort]
known-first-party = ["server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
